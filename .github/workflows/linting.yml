name: Linting

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - uses: pre-commit/action@0764670bf370aab253130d534e1eda7ff497dc60 #v2.0.0
